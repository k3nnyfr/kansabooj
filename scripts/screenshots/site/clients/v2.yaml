paths:
  /customers/{id}:
    get:
      summary: Fiche client
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Client
  /customers:
    get:
      summary: Rechercher des clients
      parameters:
      - name: q
