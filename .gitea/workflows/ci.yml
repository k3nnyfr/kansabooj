# CI Gitea Actions (syntaxe compatible GitHub Actions).
# Prérequis runner (act_runner) : jobs en conteneur avec accès au démon Docker pour le job « image »
# (montage de /var/run/docker.sock ou DinD). Secrets : REGISTRY_USER, REGISTRY_TOKEN (jeton Gitea avec
# droit write:package). Variable optionnelle : REGISTRY (défaut git.k3nny.fr).
# Les images de job minimales (ex. node:*-slim derrière le label ubuntu-latest) n'ont pas de CA système :
# Node embarque les siennes, pas Go/pip → l'étape « CA système » installe ca-certificates si besoin.
name: ci

# Un push récent annule le run encore en cours sur la même branche (évite deux services postgres concurrents).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kansabooj
          POSTGRES_PASSWORD: kansabooj
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U kansabooj" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      CGO_ENABLED: "1" # -race exige cgo (le binaire livré, lui, reste en CGO_ENABLED=0)
    steps:
      - uses: actions/checkout@v4
      - name: CA système et compilateur C (go test -race)
        run: |
          need=""
          [ -s /etc/ssl/certs/ca-certificates.crt ] || need="$need ca-certificates"
          command -v gcc >/dev/null || need="$need gcc libc6-dev"
          if [ -n "$need" ]; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq --no-install-recommends $need
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: tests (SQLite)
        working-directory: backend
        run: go test -race -count=1 -timeout 5m ./...
      - name: tests (PostgreSQL)
        working-directory: backend
        # Le nom « postgres » est résolu une seule fois : si le runner place plusieurs jobs sur un même réseau
        # Docker (container.network fixé dans act_runner, runs simultanés), il désigne plusieurs serveurs et
        # chaque connexion tomberait sur l'un ou l'autre (base temporaire « inexistante »).
        run: |
          ips=$(getent ahostsv4 postgres | awk '{print $1}' | sort -u)
          if [ "$(echo "$ips" | wc -l)" -gt 1 ]; then
            echo "::warning::« postgres » résout vers plusieurs serveurs ($(echo $ips)) : réseau Docker partagé entre jobs ?"
          fi
          ip=$(echo "$ips" | head -1)
          export KANSABOOJ_TEST_POSTGRES="postgres://kansabooj:kansabooj@${ip:-postgres}:5432/postgres?sslmode=disable"
          go test -race -count=1 -timeout 5m ./...
      - name: configuration de démo
        working-directory: backend
        run: go run ./cmd/kansabooj validate --config ../config/apis.demo.yml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CA système
        run: |
          if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq --no-install-recommends ca-certificates
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

  config-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CA système
        run: |
          if [ ! -s /etc/ssl/certs/ca-certificates.crt ]; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq --no-install-recommends ca-certificates
          fi
      # Python de la distribution plutôt qu'actions/setup-python : ce dernier ne fournit que des builds
      # Ubuntu, introuvables sur les images de job Debian (node:*-slim).
      - name: JSON Schema des configurations
        run: |
          if ! python3 -m venv --help >/dev/null 2>&1 || ! python3 -c 'import ensurepip' 2>/dev/null; then
            SUDO=$(command -v sudo || true)
            $SUDO apt-get update -qq && $SUDO apt-get install -y -qq --no-install-recommends python3 python3-venv
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema==4.23.0 pyyaml==6.0.2
          "$RUNNER_TEMP/venv/bin/python" scripts/check-schemas.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: rendu kustomize
        run: |
          for o in kubernetes openshift openshift-external-db; do
            echo "== $o"
            go run sigs.k8s.io/kustomize/kustomize/v5@v5.5.0 build deploy/kubernetes/overlays/$o > /dev/null
          done

  # Construit, scanne et publie l'image avec le démon Docker de l'hôte (act_runner monte /var/run/docker.sock).
  # Sans action tierce : client Docker de Debian + Trivy en conteneur (version et empreinte épinglées).
  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend, config-and-deploy]
    # Image Debian trixie : son paquet docker-cli (26.x, API 1.45) est accepté par les démons Docker 29+,
    # qui refusent les clients sous l'API 1.44 (celui de bookworm est en 1.41).
    container:
      image: docker.io/library/node:24-trixie-slim
    defaults:
      run:
        shell: bash # avec « container: », act_runner prend sh (dash) par défaut
    env:
      REGISTRY: ${{ vars.REGISTRY || 'git.k3nny.fr' }}
      TRIVY_IMAGE: docker.io/aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7
    steps:
      - uses: actions/checkout@v4
      - name: client Docker
        # Client seul (+ plugin buildx pour BuildKit), il pilote le démon de l'hôte par le socket monté par act_runner.
        run: |
          if ! command -v docker >/dev/null; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates docker-cli docker-buildx >/dev/null
          fi
          docker version --format 'client {{.Client.Version}} / démon {{.Server.Version}} (API {{.Server.APIVersion}})' \
            || { echo "::error::démon Docker injoignable : le runner doit monter /var/run/docker.sock"; exit 1; }
      - name: build
        run: |
          # sans git dans le job (checkout par archive) : le tag, sinon le commit court
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VERSION="${GITHUB_REF_NAME}"; else VERSION="${GITHUB_SHA::7}"; fi
          IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build -f Containerfile --build-arg VERSION="$VERSION" -t "$IMAGE:$VERSION" .
      - name: scan (Trivy)
        # Trivy tourne à côté, sur le même démon : il lit l'image par le socket. Base de vulnérabilités
        # gardée dans un volume pour ne pas la retélécharger à chaque run.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v kansabooj-trivy-cache:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 --no-progress "$IMAGE:$VERSION"
      - name: push (main et tags)
        if: github.event_name == 'push'
        env: # secrets passés par l'environnement, jamais interpolés dans le script
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_TOKEN" ]; then
            echo "::error::secrets REGISTRY_USER / REGISTRY_TOKEN absents (Paramètres du dépôt → Actions → Secrets ; jeton Gitea avec write:package)"
            exit 1
          fi
          printf '%s' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest" && docker push "$IMAGE:latest"
          else
            docker tag "$IMAGE:$VERSION" "$IMAGE:main" && docker push "$IMAGE:main"
          fi
          docker logout "$REGISTRY"
