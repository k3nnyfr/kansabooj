# Exemple de base PostgreSQL gérée par l'opérateur CloudNativePG (disponible aussi sur OpenShift
# via OperatorHub). L'opérateur génère le Secret « kansabooj-db-app » dont la clé « uri » est
# consommée par le Deployment (KANSABOOJ_DB). Toute autre base PostgreSQL ≥ 12 convient
# (Crunchy PGO, base managée…) : il suffit de fournir ce Secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kansabooj-db
spec:
  instances: 2
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: kansabooj
      owner: kansabooj
