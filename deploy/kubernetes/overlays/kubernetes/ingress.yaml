apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kansabooj
  annotations: {}
    # L'acquittement des changements utilise l'identité posée par le proxy SSO
    # (en-tête X-Forwarded-User par défaut, cf. server.user_header) : placer l'Ingress
    # derrière oauth2-proxy / l'authentification de l'ingress controller.
spec:
  rules:
    - host: kansabooj.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: kansabooj, port: { name: http } }
  tls:
    - hosts: [kansabooj.example.com]
      secretName: kansabooj-tls
