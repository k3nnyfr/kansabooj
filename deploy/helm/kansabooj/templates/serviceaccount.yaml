{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "kansabooj.metadata" (dict "ctx" $ "name" (include "kansabooj.serviceAccountName" .) "labels" .Values.serviceAccount.labels "annotations" .Values.serviceAccount.annotations) | nindent 2 }}
automountServiceAccountToken: false   # Kansabooj n'appelle pas l'API Kubernetes
{{- end }}
