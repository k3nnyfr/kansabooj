{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  {{- include "kansabooj.metadata" (dict "ctx" $ "name" (include "kansabooj.fullname" .)) | nindent 2 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kansabooj.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - { port: 8080, protocol: TCP }   # routeur / contrôleur Ingress, Prometheus (/metrics)
      {{- with .Values.networkPolicy.ingressFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    - ports:                              # DNS du cluster
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
        - { port: 5353, protocol: UDP }   # DNS OpenShift (pods dns-default)
        - { port: 5353, protocol: TCP }
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
