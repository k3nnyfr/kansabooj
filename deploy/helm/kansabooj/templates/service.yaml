apiVersion: v1
kind: Service
metadata:
  {{- include "kansabooj.metadata" (dict "ctx" $ "name" (include "kansabooj.fullname" .) "labels" .Values.service.labels "annotations" .Values.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kansabooj.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
