<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bd3'/%3E%3Cpath d='M7 20h4l3-9 4 13 3-7h4' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Kansabooj</title>
    <script>
      // Thème avant le premier rendu (pas de flash) : choix mémorisé, sinon celui du système.
      try { var theme = localStorage.getItem('kansabooj.theme') } catch (e) {}
      document.documentElement.dataset.theme = theme === 'light' || theme === 'dark' ? theme
        : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
